project:
  id: torque
  display_name: Torque
  status: active
  purpose: |
    Local-first task orchestration and execution engine for agent work. A clean
    rebuild of Fragments Engine's task FSM + scheduler + executor + MCP core,
    stripped to a single purpose and made plugin-first. Tasks move through an FSM
    (todo -> doing -> review -> done), are dispatched from a persistent queue, and
    are run by pluggable executor backends (cli, api, custom plugins). Everything
    beyond task management + execution is a plugin. Composes with Tesseract
    (memory), Hadron (blueprints), Cerberus (managed services), and Nanite
    (agent runtime). Planned to replace Fragments Engine / Volon / Engine MCP once
    adoption stabilizes.
catalog:
  torque_project_id: null            # no PRJ-* id verifiable from sources
  cerberus_project_id: torque
  tether_catalog_project: torque
locations:
  repo: ~/dev/hollis-labs/apps/torque
  agent_os_tracking: ~/dev/agent-os/workspaces/execution/torque
  state_dir: ~/.torque
  catalog: null                      # no ~/.torque/catalog directory
  artifacts: ~/.cerberus/apps/torque
build:
  authority: cerberus
  resource: torque-api-service
  command: cerberus_resource_deploy torque-api-service
deployment:
  type: launchd
  service_name: com.fragments-engine.cerberus.torque.torque-api-service
  binary: ~/.cerberus/apps/torque/torque-api-service/bin/torque-api-service
docs:
  readme: README.md
  architecture: docs/architecture/
  adrs: null                         # no docs/adrs directory
  roadmap: null                      # no docs/roadmap.md
roadmap:
  current_phase: 'In-flight MVP — executor wiring (Phase E landed; tool-registry/Plan 4 + sandbox Phase F outstanding)'
  pointer: null
usage_examples:
  - intent: Run the HTTP API, scheduler, and GUI locally
    command: torque serve
    note: Serves on TORQUE_HTTP_PORT (default 8990). Cerberus manages this as the torque-api-service launchd resource.
  - intent: Run the MCP server for a harness
    command: torque mcp
    note: stdio transport; no in-process scheduler. Restart after enabling new features.* flags so tools/list picks up new tool groups.
  - intent: Build the binaries
    command: make build
    note: Produces ./torque and ./torque-apikey-helper. Deploy via cerberus, not git.
  - intent: Run the backend test suite
    command: make test
    note: 'go test ./... -v -count=1; scheduler-only: make test-scheduler.'
scopes:
  - torque.backend.main
  - torque.frontend.main
related_projects: [tesseract, hadron, cerberus, nanite, nil, fragments-engine, tether]
