# Project agentrc config — clockwork-manifold
agentrc_version: 2.2.0

agents:
  backend:
    name: Backend Engineer
    description: Go backend development — daemon, CLI, runtime, scheduler, queue
    roles: [backend, go]
    skills: [go-build, go-lint, go-test]
    context: agents/backend.md

  frontend:
    name: Frontend Developer
    description: React/Vite GUI development — components, pages, state
    roles: [frontend, react]
    skills: [shadcn-install]
    context: agents/frontend.md

  reviewer:
    name: Code Reviewer
    description: Reviews code for bugs, security, correctness, and standards
    roles: [code-review]
    skills: [doc-note]
    context: agents/reviewer.md

  designer:
    name: UI/UX Designer
    description: UI design, component architecture, and user experience
    roles: [frontend]
    skills: [doc-note]
    context: agents/designer.md

  planner:
    name: Planning Agent
    description: Strategic planning, scoping, and architecture decisions
    roles: [strategic-planner]
    skills: [adr, blg, doc-note, doc-search]
    context: agents/planner.md

  docs:
    name: Documentation Agent
    description: Project documentation — guides, ADRs, API docs, specs
    roles: [project-docs]
    skills: [doc-note, doc-search]
    context: agents/docs.md
